<div class="app-layout">
  
  <!-- Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <div>
          <h1 class="brand-title">{{ title() }}</h1>
          <p class="brand-subtitle">Asynchronous high-volume spreadsheet importer (up to 500,000 rows)</p>
        </div>
      </div>
      <div class="header-actions" style="display: flex; align-items: center; gap: 12px;">
        @if (auth.isAuthenticated()) {
          <div class="user-pill" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); padding: 6px 12px; border-radius: 6px; font-size: 13px;">
            <span style="color: #94a3b8;">User:</span>
            <span style="font-weight: 500; color: #f8fafc;">{{ auth.currentUser()?.email || 'Authenticated' }}</span>
            <button type="button" class="btn btn-secondary btn-sm" (click)="onLogout()" style="margin-left: 6px;">
              Sign Out
            </button>
          </div>
          <button type="button" class="btn btn-primary btn-lg" (click)="openUploadModal()">
            <span>+ Upload Spreadsheet</span>
          </button>
        }
      </div>
    </div>
  </header>

  <!-- Navigation Bar for Authenticated Users -->
  @if (auth.isAuthenticated()) {
    <nav class="app-subnav">
      <div class="content-container subnav-container">
        <a routerLink="/imports" routerLinkActive="active-tab" class="subnav-tab">
          📋 Import History
        </a>
        <a routerLink="/imported-data" routerLinkActive="active-tab" class="subnav-tab">
          👥 Imported Data
        </a>
      </div>
    </nav>
  }

  <!-- Main Content Container with Router Outlet -->
  <main class="main-content">
    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Modal Component Integration -->
  @if (isModalOpen()) {
    <app-import-modal 
      [importId]="activeModalImportId()"
      (closed)="onModalClosed()"
      (importCreated)="onImportCreated($event)"
    ></app-import-modal>
  }

</div>
